<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receipt Analyzer</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --ink:       #111318;
            --ink-mid:   #5a5f72;
            --ink-light: #9ba3b8;
            --surface:   #f7f8fc;
            --card:      #ffffff;
            --accent:    #2d6ef5;
            --accent-bg: #edf2ff;
            --green:     #1db87a;
            --green-bg:  #e8faf3;
            --red:       #e03b3b;
            --red-bg:    #fdeaea;
            --border:    #e4e7f0;
            --shadow:    0 2px 12px rgba(17,19,24,0.07);
            --radius:    12px;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--surface);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px 80px;
        }

        /* ── Header ── */
        header {
            text-align: center;
            margin-bottom: 36px;
        }
        .logo {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 10px;
        }
        h1 {
            font-size: clamp(28px, 5vw, 42px);
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.1;
            color: var(--ink);
        }
        h1 span {
            color: var(--accent);
        }
        .subtitle {
            margin-top: 10px;
            color: var(--ink-mid);
            font-size: 15px;
        }

        /* ── Main card ── */
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 600px;
            padding: 32px;
        }

        /* ── Upload zone ── */
        .upload-zone {
            border: 2px dashed var(--border);
            border-radius: 10px;
            padding: 48px 24px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            position: relative;
        }
        .upload-zone:hover, .upload-zone.drag-over {
            border-color: var(--accent);
            background: var(--accent-bg);
        }
        .upload-zone input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }
        .upload-icon {
            font-size: 36px;
            margin-bottom: 12px;
        }
        .upload-zone h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--ink);
            margin-bottom: 6px;
        }
        .upload-zone p {
            font-size: 13px;
            color: var(--ink-light);
        }

        /* ── Preview ── */
        #preview-wrap {
            display: none;
            margin-top: 20px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
            position: relative;
        }
        #preview-wrap img {
            width: 100%;
            max-height: 260px;
            object-fit: cover;
            display: block;
        }
        .preview-label {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(17,19,24,0.65);
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 4px 10px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
        }

        /* ── Button ── */
        .btn {
            display: block;
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            background: var(--accent);
            color: #fff;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.15s, transform 0.1s;
            letter-spacing: 0.01em;
        }
        .btn:hover:not(:disabled) { opacity: 0.88; transform: translateY(-1px); }
        .btn:active:not(:disabled) { transform: translateY(0); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* ── Status bar ── */
        #status {
            display: none;
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
        }
        #status.info    { background: var(--accent-bg); color: var(--accent); }
        #status.success { background: var(--green-bg);  color: var(--green); }
        #status.error   { background: var(--red-bg);    color: var(--red); }

        /* ── Processing animation ── */
        .spinner {
            display: inline-block;
            width: 14px; height: 14px;
            border: 2px solid currentColor;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Results ── */
        #results {
            display: none;
            margin-top: 28px;
        }
        .results-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        .results-header h2 {
            font-size: 17px;
            font-weight: 700;
        }
        .badge {
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
        }
        .badge.verified   { background: var(--green-bg); color: var(--green); }
        .badge.unverified { background: var(--red-bg);   color: var(--red); }

        /* ── Data grid ── */
        .data-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }
        .data-cell {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px 16px;
        }
        .data-cell.full { grid-column: 1 / -1; }
        .data-cell label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--ink-light);
            margin-bottom: 4px;
        }
        .data-cell .value {
            font-size: 16px;
            font-weight: 600;
            color: var(--ink);
        }
        .data-cell .value.total-value {
            font-size: 22px;
            color: var(--accent);
        }
        .data-cell .value.mono {
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
        }

        /* ── Items list ── */
        .items-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 4px;
        }
        .items-table tr {
            border-bottom: 1px solid var(--border);
        }
        .items-table tr:last-child { border-bottom: none; }
        .items-table td {
            padding: 10px 0;
            font-size: 14px;
        }
        .items-table td:last-child {
            text-align: right;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 500;
            color: var(--ink);
        }
        .items-table td:first-child { color: var(--ink-mid); }

        /* ── Raw JSON toggle ── */
        .raw-toggle {
            margin-top: 16px;
            font-size: 13px;
            color: var(--ink-light);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            user-select: none;
        }
        .raw-toggle:hover { color: var(--ink-mid); }
        #raw-wrap {
            display: none;
            margin-top: 10px;
        }
        pre {
            background: var(--ink);
            color: #a8d8a8;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<header>
    <div class="logo">Receipt Analyzer</div>
    <h1>Scan any <span>receipt</span>,<br>get clean data.</h1>
    <p class="subtitle">Upload a photo — OCR extracts vendor, items & total instantly.</p>
    <div style="margin-top: 16px; font-size: 14px; color: #5a5f72;">
        👋 Welcome, <strong id="welcomeName"></strong> &nbsp;·&nbsp;
        <a href="#" id="logoutBtn" style="color: #e03b3b; text-decoration: none; font-weight: 600;">Sign out</a>
    </div>
</header>

<div class="card">

    <!-- Upload -->
    <div class="upload-zone" id="uploadZone">
        <input type="file" id="fileInput" accept="image/*">
        <div class="upload-icon">🧾</div>
        <h3>Drop your receipt here</h3>
        <p>or click to browse — JPG, PNG supported</p>
    </div>

    <!-- Preview -->
    <div id="preview-wrap">
        <span class="preview-label">Preview</span>
        <img id="preview" alt="Receipt preview">
    </div>

    <button class="btn" id="uploadBtn" disabled>Analyze Receipt</button>

    <div id="status"></div>

    <!-- Results -->
    <div id="results">
        <div class="results-header">
            <h2>Extracted Data</h2>
            <span class="badge" id="verifiedBadge"></span>
        </div>

        <div class="data-grid">
            <div class="data-cell">
                <label>Vendor</label>
                <div class="value" id="r-vendor">—</div>
            </div>
            <div class="data-cell">
                <label>Date</label>
                <div class="value mono" id="r-date">—</div>
            </div>
            <div class="data-cell">
                <label>Total</label>
                <div class="value total-value" id="r-total">Rs. 0.00</div>
            </div>
            <div class="data-cell">
                <label>Confidence</label>
                <div class="value" id="r-confidence">0%</div>
            </div>
            <div class="data-cell full" id="items-cell" style="display:none">
                <label>Items</label>
                <table class="items-table" id="r-items"></table>
            </div>
        </div>

        <div class="raw-toggle" id="rawToggle">▶ Show raw JSON</div>
        <div id="raw-wrap">
            <pre id="rawResponse"></pre>
        </div>
    </div>

</div>

<script>
    const API_BASE = 'http://localhost:8000';

    // ── Auth guard ──
    const token = localStorage.getItem('token');
    if (!token) window.location.href = 'login.html';

    const uploadZone = document.getElementById('uploadZone');
    const fileInput  = document.getElementById('fileInput');
    const uploadBtn  = document.getElementById('uploadBtn');
    const statusDiv  = document.getElementById('status');
    const previewWrap= document.getElementById('preview-wrap');
    const preview    = document.getElementById('preview');
    const resultsDiv = document.getElementById('results');
    const rawToggle  = document.getElementById('rawToggle');
    const rawWrap    = document.getElementById('raw-wrap');

    let selectedFile = null;

    document.getElementById('welcomeName').textContent = localStorage.getItem('userName') || 'User';
    document.getElementById('logoutBtn').addEventListener('click', () => {
    localStorage.removeItem('token');
    localStorage.removeItem('userName');
    window.location.href = 'login.html';
});

    // ── Drag & drop ──
    uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
    uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
    uploadZone.addEventListener('drop', e => {
        e.preventDefault();
        uploadZone.classList.remove('drag-over');
        const f = e.dataTransfer.files[0];
        if (f && f.type.startsWith('image/')) handleFile(f);
    });
    fileInput.addEventListener('change', e => { if (e.target.files[0]) handleFile(e.target.files[0]); });

    function handleFile(file) {
        selectedFile = file;
        uploadBtn.disabled = false;
        const reader = new FileReader();
        reader.onload = e => {
            preview.src = e.target.result;
            previewWrap.style.display = 'block';
        };
        reader.readAsDataURL(file);
        setStatus(`${file.name} ready`, 'info');
    }

    function setStatus(msg, type = 'info', spinner = false) {
        statusDiv.className = type;
        statusDiv.style.display = 'block';
        statusDiv.innerHTML = (spinner ? '<span class="spinner"></span>' : '') + msg;
    }

    // ── Upload ──
    uploadBtn.addEventListener('click', async () => {
        if (!selectedFile) return;
        setStatus('Analyzing receipt…', 'info', true);
        uploadBtn.disabled = true;
        resultsDiv.style.display = 'none';

        const form = new FormData();
        form.append('image', selectedFile);

        try {
            const res = await fetch(`${API_BASE}/api/receipts/upload`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`
                },
                body: form
            });
            const data = await res.json();

            if (res.status === 401) {
                localStorage.removeItem('token');
                localStorage.removeItem('userName');
                window.location.href = 'login.html';
                return;
            }

            if (res.ok) {
                setStatus('Receipt analyzed successfully', 'success');
                renderResults(data);
            } else {
                setStatus(`Error: ${data.detail || 'Unknown error'}`, 'error');
            }
        } catch (err) {
            console.error(err);
            setStatus(`Could not reach server: ${err.message}`, 'error');
        } finally {
            uploadBtn.disabled = false;
        }
    });

    // ── Render results ──
    function renderResults(data) {
        try {
            const ex = data.extracted_data || {};
            document.getElementById('r-vendor').textContent     = ex.vendor || '—';
            document.getElementById('r-date').textContent       = ex.date   || '—';
            document.getElementById('r-total').textContent      = `Rs. ${parseFloat(ex.total || 0).toFixed(2)}`;
            document.getElementById('r-confidence').textContent = `${ex.confidence || 0}%`;

            const badge = document.getElementById('verifiedBadge');
            if (ex.verified) {
                badge.textContent = '✓ Verified';
                badge.className   = 'badge verified';
            } else {
                badge.textContent = '✗ Unverified';
                badge.className   = 'badge unverified';
            }

            const itemsCell  = document.getElementById('items-cell');
            const itemsTable = document.getElementById('r-items');
            const items = Array.isArray(ex.items) ? ex.items : [];
            if (items.length > 0) {
                itemsTable.innerHTML = items.map(item => {
                    const name  = item.name  || 'Unknown item';
                    const price = parseFloat(item.price || 0).toFixed(2);
                    return `<tr><td>${name}</td><td>Rs. ${price}</td></tr>`;
                }).join('');
                itemsCell.style.display = 'block';
            } else {
                itemsCell.style.display = 'none';
            }

            document.getElementById('rawResponse').textContent = JSON.stringify(data, null, 2);
            resultsDiv.style.display = 'block';
            resultsDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
        } catch (err) {
            setStatus(`Display error: ${err.message}`, 'error');
        }
    }

    // ── Raw JSON toggle ──
    rawToggle.addEventListener('click', () => {
        const open = rawWrap.style.display === 'block';
        rawWrap.style.display = open ? 'none' : 'block';
        rawToggle.textContent = (open ? '▶' : '▼') + ' Show raw JSON';
    });
</script>
</body>
</html>
