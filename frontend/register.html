<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register — Receipt Analyzer</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7f8fc;
      font-family: 'Space Grotesk', sans-serif;
    }
    .card {
      background: #fff;
      border: 1px solid #e4e7f0;
      border-radius: 12px;
      padding: 40px 36px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 2px 12px rgba(17,19,24,0.07);
    }
    .logo {
      text-align: center;
      margin-bottom: 28px;
    }
    .logo span { font-size: 2rem; }
    .logo h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #111318;
      margin-top: 8px;
    }
    .logo p { font-size: 0.875rem; color: #5a5f72; margin-top: 4px; }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #5a5f72;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #e4e7f0;
      border-radius: 8px;
      font-size: 0.9375rem;
      font-family: 'Space Grotesk', sans-serif;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 18px;
    }
    input:focus { border-color: #2d6ef5; }
    button {
      width: 100%;
      padding: 12px;
      background: #2d6ef5;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      font-family: 'Space Grotesk', sans-serif;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.88; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .error {
      background: #fdeaea;
      border: 1px solid #f5c0c0;
      color: #e03b3b;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.875rem;
      margin-bottom: 16px;
      display: none;
    }
    .footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.875rem;
      color: #5a5f72;
    }
    .footer a { color: #2d6ef5; text-decoration: none; font-weight: 600; }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <span>🧾</span>
      <h1>Receipt Analyzer</h1>
      <p>Create your account</p>
    </div>

    <div class="error" id="errorMsg"></div>

    <form id="registerForm">
      <label for="name">Full Name</label>
      <input type="text" id="name" placeholder="Nishan Maharjan" required />

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com" required />

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="At least 8 characters" minlength="8" required />

      <button type="submit" id="submitBtn">Create Account</button>
    </form>

    <div class="footer">
      Already have an account? <a href="login.html">Sign in</a>
    </div>
  </div>

  <script>
    if (localStorage.getItem('token')) window.location.href = 'index.html';

    const form      = document.getElementById('registerForm');
    const errorMsg  = document.getElementById('errorMsg');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account…';

      try {
        const res = await fetch('http://localhost:8000/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Registration failed');

        localStorage.setItem('token', data.access_token);
        localStorage.setItem('userName', data.name);
        window.location.href = 'index.html';

      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
