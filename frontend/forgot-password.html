<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot Password — Receipt Analyzer</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7f8fc;
      font-family: 'Space Grotesk', sans-serif;
    }
    .card {
      background: #fff;
      border: 1px solid #e4e7f0;
      border-radius: 12px;
      padding: 40px 36px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 2px 12px rgba(17,19,24,0.07);
    }
    .logo { text-align: center; margin-bottom: 28px; }
    .logo span { font-size: 2rem; }
    .logo h1 { font-size: 1.25rem; font-weight: 700; color: #111318; margin-top: 8px; }
    .logo p { font-size: 0.875rem; color: #5a5f72; margin-top: 4px; }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #5a5f72;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #e4e7f0;
      border-radius: 8px;
      font-size: 0.9375rem;
      font-family: 'Space Grotesk', sans-serif;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 18px;
    }
    input:focus { border-color: #2d6ef5; }
    button {
      width: 100%;
      padding: 12px;
      background: #2d6ef5;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      font-family: 'Space Grotesk', sans-serif;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.88; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .msg {
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.875rem;
      margin-bottom: 16px;
      display: none;
    }
    .msg.error   { background: #fdeaea; border: 1px solid #f5c0c0; color: #e03b3b; }
    .msg.success { background: #e8faf3; border: 1px solid #a7f3d0; color: #1db87a; }
    .footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.875rem;
      color: #5a5f72;
    }
    .footer a { color: #2d6ef5; text-decoration: none; font-weight: 600; }
    .footer a:hover { text-decoration: underline; }
    .step { display: none; }
    .step.active { display: block; }
    .otp-hint {
      font-size: 0.8rem;
      color: #9ba3b8;
      margin-top: -12px;
      margin-bottom: 18px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <span>🔑</span>
      <h1>Reset Password</h1>
      <p id="stepDesc">Enter your email to receive an OTP</p>
    </div>

    <div class="msg" id="msgBox"></div>

    <!-- Step 1: Enter email -->
    <div class="step active" id="step1">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com" required />
      <button id="sendOtpBtn">Send OTP</button>
    </div>

    <!-- Step 2: Enter OTP + new password -->
    <div class="step" id="step2">
      <label for="otp">OTP</label>
      <input type="text" id="otp" placeholder="6-digit code" maxlength="6" required />
      <p class="otp-hint">Check your email for the 6-digit code</p>

      <label for="newPassword">New Password</label>
      <input type="password" id="newPassword" placeholder="At least 8 characters" minlength="8" required />

      <label for="confirmPassword">Confirm Password</label>
      <input type="password" id="confirmPassword" placeholder="Repeat new password" required />

      <button id="resetBtn">Reset Password</button>
    </div>

    <div class="footer">
      <a href="login.html">← Back to login</a>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:8000';
    let userEmail = '';

    function showMsg(text, type) {
      const box = document.getElementById('msgBox');
      box.textContent = text;
      box.className = `msg ${type}`;
      box.style.display = 'block';
    }

    function hideMsg() {
      document.getElementById('msgBox').style.display = 'none';
    }

    // ── Step 1: Send OTP ──
    document.getElementById('sendOtpBtn').addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim();
      if (!email) { showMsg('Enter your email', 'error'); return; }

      const btn = document.getElementById('sendOtpBtn');
      btn.disabled = true;
      btn.textContent = 'Sending…';
      hideMsg();

      try {
        const res = await fetch(`${API_BASE}/api/auth/forgot-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();

        userEmail = email;
        showMsg(data.message, 'success');

        // Move to step 2
        document.getElementById('step1').classList.remove('active');
        document.getElementById('step2').classList.add('active');
        document.getElementById('stepDesc').textContent = `OTP sent to ${email}`;

      } catch (err) {
        showMsg('Something went wrong. Try again.', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Send OTP';
      }
    });

    // ── Step 2: Verify OTP + reset password ──
    document.getElementById('resetBtn').addEventListener('click', async () => {
      const otp         = document.getElementById('otp').value.trim();
      const newPassword = document.getElementById('newPassword').value;
      const confirm     = document.getElementById('confirmPassword').value;

      if (!otp || otp.length !== 6) { showMsg('Enter the 6-digit OTP', 'error'); return; }
      if (newPassword.length < 8)   { showMsg('Password must be at least 8 characters', 'error'); return; }
      if (newPassword !== confirm)   { showMsg('Passwords do not match', 'error'); return; }

      const btn = document.getElementById('resetBtn');
      btn.disabled = true;
      btn.textContent = 'Resetting…';
      hideMsg();

      try {
        const res = await fetch(`${API_BASE}/api/auth/verify-otp`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: userEmail, otp, new_password: newPassword })
        });
        const data = await res.json();

        if (!res.ok) throw new Error(data.detail || 'Reset failed');

        showMsg('Password reset! Redirecting to login…', 'success');
        setTimeout(() => {
            localStorage.removeItem('token');
            localStorage.removeItem('userName');
            window.location.href = 'login.html';
        }, 2000);

      } catch (err) {
        showMsg(err.message, 'error');
        btn.disabled = false;
        btn.textContent = 'Reset Password';
      }
    });
  </script>
</body>
</html>
