<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Receipt Analyzer</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7f8fc;
      font-family: 'Space Grotesk', sans-serif;
    }
    .card {
      background: #fff;
      border: 1px solid #e4e7f0;
      border-radius: 12px;
      padding: 40px 36px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 2px 12px rgba(17,19,24,0.07);
    }
    .logo { text-align: center; margin-bottom: 28px; }
    .logo span { font-size: 2rem; }
    .logo h1 { font-size: 1.25rem; font-weight: 700; color: #111318; margin-top: 8px; }
    .logo p { font-size: 0.875rem; color: #5a5f72; margin-top: 4px; }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #5a5f72;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #e4e7f0;
      border-radius: 8px;
      font-size: 0.9375rem;
      font-family: 'Space Grotesk', sans-serif;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 18px;
    }
    input:focus { border-color: #2d6ef5; }
    .forgot-link {
      display: block;
      text-align: right;
      font-size: 0.8rem;
      font-weight: 600;
      color: #2d6ef5;
      text-decoration: none;
      margin-top: -12px;
      margin-bottom: 18px;
    }
    .forgot-link:hover { text-decoration: underline; }
    button {
      width: 100%;
      padding: 12px;
      background: #2d6ef5;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      font-family: 'Space Grotesk', sans-serif;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.88; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: #9ba3b8;
      font-size: 0.8rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e4e7f0;
    }
    .google-btn {
      width: 100%;
      padding: 11px;
      background: #fff;
      color: #111318;
      border: 1px solid #e4e7f0;
      border-radius: 8px;
      font-size: 0.9375rem;
      font-weight: 600;
      font-family: 'Space Grotesk', sans-serif;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .google-btn:hover { background: #f7f8fc; border-color: #2d6ef5; }
    .google-icon { width: 20px; height: 20px; }
    .error {
      background: #fdeaea;
      border: 1px solid #f5c0c0;
      color: #e03b3b;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.875rem;
      margin-bottom: 16px;
      display: none;
    }
    .footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.875rem;
      color: #5a5f72;
    }
    .footer a { color: #2d6ef5; text-decoration: none; font-weight: 600; }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <span>🧾</span>
      <h1>Receipt Analyzer</h1>
      <p>Sign in to your account</p>
    </div>

    <div class="error" id="errorMsg"></div>

    <form id="loginForm">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com" required />

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••" required />
      <a href="forgot-password.html" class="forgot-link">Forgot password?</a>

      <button type="submit" id="submitBtn">Sign In</button>
    </form>

    <div class="divider">or</div>

    <button class="google-btn" id="googleBtn">
      <svg class="google-icon" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Continue with Google
    </button>

    <div class="footer">
      Don't have an account? <a href="register.html">Create one</a>
    </div>
  </div>

  <script>
    const GOOGLE_CLIENT_ID = '519025071003-cv8i4f9kqie4n1mdclrosbom3jio0rd9.apps.googleusercontent.com';
    const API_BASE = 'http://localhost:8000';

    if (localStorage.getItem('token')) window.location.href = 'index.html';

    const form      = document.getElementById('loginForm');
    const errorMsg  = document.getElementById('errorMsg');
    const submitBtn = document.getElementById('submitBtn');
    const googleBtn = document.getElementById('googleBtn');

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.style.display = 'block';
    }

    // ── Email login ──
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in…';

      try {
        const res = await fetch(`${API_BASE}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Login failed');

        localStorage.setItem('token', data.access_token);
        localStorage.setItem('userName', data.name);
        window.location.href = 'index.html';

      } catch (err) {
        showError(err.message);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    });

    // ── Google login ──
    googleBtn.addEventListener('click', () => {
      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleGoogleResponse
      });
      google.accounts.id.prompt();
    });

    async function handleGoogleResponse(response) {
      try {
        const res = await fetch(`${API_BASE}/api/auth/google`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ credential: response.credential })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Google login failed');

        localStorage.setItem('token', data.access_token);
        localStorage.setItem('userName', data.name);
        window.location.href = 'index.html';

      } catch (err) {
        showError(err.message);
      }
    }
  </script>
</body>
</html>
