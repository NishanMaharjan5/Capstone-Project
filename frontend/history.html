<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receipt History — Receipt Analyzer</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --ink:       #111318;
            --ink-mid:   #5a5f72;
            --ink-light: #9ba3b8;
            --surface:   #f7f8fc;
            --card:      #ffffff;
            --accent:    #2d6ef5;
            --accent-bg: #edf2ff;
            --green:     #1db87a;
            --green-bg:  #e8faf3;
            --red:       #e03b3b;
            --red-bg:    #fdeaea;
            --border:    #e4e7f0;
            --shadow:    0 2px 12px rgba(17,19,24,0.07);
            --radius:    12px;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--surface);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px 80px;
        }

        /* ── Header ── */
        header {
            width: 100%;
            max-width: 860px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 36px;
            position: relative;
        }
        .back-btn {
            font-size: 14px;
            font-weight: 600;
            color: var(--accent);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .back-btn:hover { opacity: 0.75; }
        .header-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 18px;
            font-weight: 700;
            color: var(--ink);
        }

        /* ── Avatar / dropdown ── */
        .user-menu { position: relative; }
        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--accent);
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
        }
        .dropdown {
            display: none;
            position: absolute;
            top: 44px;
            right: 0;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            box-shadow: 0 8px 24px rgba(17,19,24,0.12);
            min-width: 180px;
            z-index: 100;
            overflow: hidden;
        }
        .dropdown.open { display: block; }
        .dropdown-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
        }
        .dropdown-header .name { font-size: 14px; font-weight: 600; color: var(--ink); }
        .dropdown-header .email { font-size: 12px; color: var(--ink-light); margin-top: 2px; }
        .dropdown-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 16px;
            font-size: 14px;
            font-weight: 500;
            color: var(--ink-mid);
            cursor: pointer;
            transition: background 0.15s;
            text-decoration: none;
        }
        .dropdown-item:hover { background: var(--surface); color: var(--ink); }
        .dropdown-item.danger { color: var(--red); }
        .dropdown-item.danger:hover { background: var(--red-bg); }

        /* ── Main container ── */
        .container {
            width: 100%;
            max-width: 860px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* ── Stats bar ── */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }
        .stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px 20px;
            box-shadow: var(--shadow);
        }
        .stat-card .stat-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--ink-light);
            margin-bottom: 6px;
        }
        .stat-card .stat-value {
            font-size: 22px;
            font-weight: 700;
            color: var(--ink);
        }
        .stat-card .stat-value.accent { color: var(--accent); }

        /* ── Card ── */
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }
        .card-header {
            padding: 18px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .card-header h2 { font-size: 16px; font-weight: 700; }

        /* ── Table ── */
        table {
            width: 100%;
            border-collapse: collapse;
        }
        thead tr {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }
        thead th {
            padding: 11px 16px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--ink-light);
            text-align: left;
        }
        tbody tr {
            border-bottom: 1px solid var(--border);
            transition: background 0.15s;
        }
        tbody tr:last-child { border-bottom: none; }
        tbody tr:hover { background: var(--surface); }
        tbody td {
            padding: 14px 16px;
            font-size: 14px;
            color: var(--ink);
            vertical-align: middle;
        }
        .td-vendor { font-weight: 600; }
        .td-total {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            color: var(--accent);
        }
        .td-date { color: var(--ink-mid); font-size: 13px; }
        .source-badge {
            font-size: 11px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 20px;
            background: var(--accent-bg);
            color: var(--accent);
        }
        .source-badge.manual {
            background: var(--green-bg);
            color: var(--green);
        }
        .delete-btn {
            background: none;
            border: none;
            color: var(--ink-light);
            cursor: pointer;
            font-size: 16px;
            padding: 4px 8px;
            border-radius: 6px;
            transition: background 0.15s, color 0.15s;
        }
        .delete-btn:hover { background: var(--red-bg); color: var(--red); }

        .empty-state {
            padding: 48px 24px;
            text-align: center;
            color: var(--ink-light);
            font-size: 14px;
        }
        .empty-state .emoji { font-size: 32px; margin-bottom: 12px; }

        /* ── Manual entry form ── */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            padding: 24px;
        }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group.full { grid-column: 1 / -1; }
        .form-group label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--ink-light);
        }
        .form-group input, .form-group textarea, .form-group select {
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Space Grotesk', sans-serif;
            outline: none;
            transition: border-color 0.2s;
            background: var(--surface);
        }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: var(--accent); background: #fff; }
        .form-group textarea { resize: vertical; min-height: 80px; }

        .manual-items {
            grid-column: 1 / -1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .manual-item-row {
            display: grid;
            grid-template-columns: 1fr 110px 130px 38px;
            gap: 10px;
            align-items: end;
        }
        .manual-item-row .remove-item {
            height: 39px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #fff;
            color: var(--ink-light);
            cursor: pointer;
            font-size: 16px;
        }
        .manual-item-row .remove-item:hover {
            background: var(--red-bg);
            color: var(--red);
        }
        .detail-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--accent);
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 10px;
            border-radius: 8px;
            font-family: 'Space Grotesk', sans-serif;
        }
        .detail-btn:hover { background: var(--accent-bg); }
        .detail-row td {
            padding: 0;
            background: #fff;
        }
        .receipt-detail {
            margin: 0;
            padding: 22px 20px 26px;
            border-top: 1px solid var(--border);
            background:
                linear-gradient(90deg, rgba(17,19,24,0.04) 50%, transparent 0) 0 0 / 10px 1px repeat-x,
                #fbfcff;
        }
        .receipt-paper {
            max-width: 460px;
            margin: 0 auto;
            background: #fff;
            border: 1px solid #d9deeb;
            border-radius: 6px;
            box-shadow: 0 10px 28px rgba(17,19,24,0.08);
            padding: 24px 24px 18px;
            color: var(--ink);
        }
        .receipt-head {
            text-align: center;
            border-bottom: 1px dashed #c8cede;
            padding-bottom: 14px;
            margin-bottom: 14px;
        }
        .receipt-head h3 {
            font-size: 22px;
            line-height: 1.15;
            margin-bottom: 8px;
            color: var(--ink);
        }
        .receipt-meta {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 6px 14px;
            color: var(--ink-mid);
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
        }
        .receipt-category {
            margin-top: 10px;
            display: inline-block;
            padding: 4px 10px;
            border-radius: 999px;
            background: var(--accent-bg);
            color: var(--accent);
            font-size: 11px;
            font-weight: 700;
        }
        .digital-items {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
        }
        .digital-items th,
        .digital-items td {
            padding: 9px 0;
            border-bottom: 1px dashed #d8deea;
            font-size: 13px;
        }
        .digital-items tr:last-child td { border-bottom: none; }
        .digital-items td:not(:first-child),
        .digital-items th:not(:first-child) {
            text-align: right;
            font-family: 'JetBrains Mono', monospace;
        }
        .receipt-total {
            border-top: 2px solid var(--ink);
            margin-top: 12px;
            padding-top: 12px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-weight: 800;
        }
        .receipt-total span:first-child {
            font-size: 13px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .receipt-total span:last-child {
            font-size: 20px;
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent);
        }
        .receipt-foot {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px dashed #c8cede;
            text-align: center;
            color: var(--ink-light);
            font-size: 11px;
        }
        .row-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
        }

        .form-actions {
            padding: 0 24px 24px;
            display: flex;
            gap: 10px;
        }
        .btn {
            padding: 11px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Space Grotesk', sans-serif;
            cursor: pointer;
            border: none;
            transition: opacity 0.15s;
        }
        .btn:hover { opacity: 0.85; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-ghost {
            background: none;
            border: 1px solid var(--border);
            color: var(--ink-mid);
        }
        .btn-ghost:hover { background: var(--surface); opacity: 1; }

        .form-status {
            margin: 0 24px 16px;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            display: none;
        }
        .form-status.success { background: var(--green-bg); color: var(--green); }
        .form-status.error   { background: var(--red-bg);   color: var(--red); }

        /* ── Add entry toggle ── */
        .add-toggle {
            font-size: 13px;
            font-weight: 600;
            color: var(--accent);
            cursor: pointer;
            background: none;
            border: none;
            font-family: 'Space Grotesk', sans-serif;
            padding: 0;
        }
        .add-toggle:hover { opacity: 0.75; }

        .spinner {
            display: inline-block;
            width: 12px; height: 12px;
            border: 2px solid currentColor;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-right: 6px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 720px) {
            .stats-bar,
            .form-grid,
            .manual-item-row {
                grid-template-columns: 1fr;
            }
            .manual-item-row .remove-item {
                width: 100%;
            }
            table {
                min-width: 680px;
            }
            #tableWrap {
                overflow-x: auto;
            }
        }
    </style>
</head>
<body>

<header>
    <a href="index.html" class="back-btn">← Back</a>
    <span class="header-title">Receipt History</span>
    <div class="user-menu">
        <div class="avatar" id="avatarBtn"></div>
        <div class="dropdown" id="dropdown">
            <div class="dropdown-header">
                <div class="name" id="dropdownName"></div>
                <div class="email" id="dropdownEmail"></div>
            </div>
            <a href="index.html" class="dropdown-item">🏠 &nbsp;Home</a>
            <div class="dropdown-item danger" id="logoutBtn">🚪 &nbsp;Sign out</div>
        </div>
    </div>
</header>

<div class="container">

    <!-- Stats -->
    <div class="stats-bar">
        <div class="stat-card">
            <div class="stat-label">Total Receipts</div>
            <div class="stat-value" id="statCount">—</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Total Spent</div>
            <div class="stat-value accent" id="statTotal">—</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Latest Receipt</div>
            <div class="stat-value" id="statLatest" style="font-size:15px;">—</div>
        </div>
    </div>

    <!-- Receipt table -->
    <div class="card">
        <div class="card-header">
            <h2>All Receipts</h2>
            <button class="add-toggle" id="toggleForm">+ Add Manual Entry</button>
        </div>

        <!-- Manual entry form (hidden by default) -->
        <div id="manualForm" style="display:none; border-bottom: 1px solid var(--border);">
            <div class="form-grid">
                <div class="form-group">
                    <label>Vendor</label>
                    <input type="text" id="f-vendor" placeholder="e.g. Bhatbhateni" />
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="f-date" />
                </div>
                <div class="form-group">
                    <label>Total (Rs.)</label>
                    <input type="number" id="f-total" placeholder="0.00" step="0.01" readonly />
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="f-category" required>
                        <option value="" selected disabled>Select category</option>
                        <option>Food & Dining</option>
                        <option>Groceries</option>
                        <option>Transport & Vehicle</option>
                        <option>Health & Medical</option>
                        <option>Entertainment</option>
                        <option>Shopping</option>
                        <option>Utilities & Bills</option>
                        <option>Other</option>
                    </select>
                </div>
                <div class="manual-items">
                    <div class="section-label">Items</div>
                    <div id="manualItems"></div>
                    <button class="btn btn-ghost" id="addManualItem" type="button">+ Add Item</button>
                </div>
            </div>
            <div class="form-status" id="formStatus"></div>
            <div class="form-actions">
                <button class="btn btn-primary" id="submitManual">Save Receipt</button>
                <button class="btn btn-ghost" id="cancelManual">Discard</button>
            </div>
        </div>

        <!-- Table -->
        <div id="tableWrap">
            <div class="empty-state">
                <div class="spinner"></div> Loading receipts…
            </div>
        </div>
    </div>

</div>

<script>
    const API_BASE = 'http://localhost:8000';
    const token = localStorage.getItem('token');
    if (!token) window.location.href = 'login.html';

    // ── User menu ──
    const userName  = localStorage.getItem('userName') || 'User';
    const userEmail = localStorage.getItem('userEmail') || '';
    document.getElementById('avatarBtn').textContent     = userName.charAt(0).toUpperCase();
    document.getElementById('dropdownName').textContent  = userName;
    document.getElementById('dropdownEmail').textContent = userEmail;

    document.getElementById('avatarBtn').addEventListener('click', e => {
        e.stopPropagation();
        document.getElementById('dropdown').classList.toggle('open');
    });
    document.addEventListener('click', () => {
        document.getElementById('dropdown').classList.remove('open');
    });
    document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.clear();
        window.location.href = 'login.html';
    });

    // ── Load receipts ──
    let allReceipts = [];

    function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, char => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        }[char]));
    }

    function formatMoney(value) {
        return `Rs. ${parseFloat(value || 0).toFixed(2)}`;
    }

    function itemLineTotal(item) {
        const quantity = parseFloat(item.quantity || 1);
        const unitPrice = parseFloat(item.unit_price ?? item.price ?? 0);
        return parseFloat(item.price ?? (quantity * unitPrice) ?? 0);
    }

    async function loadReceipts() {
        try {
            const res  = await fetch(`${API_BASE}/api/receipts/`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (res.status === 401) { localStorage.clear(); window.location.href = 'login.html'; return; }
            const data = await res.json();
            allReceipts = data.receipts || [];
            renderTable();
            renderStats();
        } catch (err) {
            document.getElementById('tableWrap').innerHTML = `<div class="empty-state">❌ Could not load receipts</div>`;
        }
    }

    function renderStats() {
        const count = allReceipts.length;
        const total = allReceipts.reduce((sum, r) => sum + (parseFloat(r.total) || 0), 0);
        const latest = allReceipts.length > 0 ? (allReceipts[0].vendor || 'Unknown') : '—';

        document.getElementById('statCount').textContent  = count;
        document.getElementById('statTotal').textContent  = `Rs. ${total.toFixed(2)}`;
        document.getElementById('statLatest').textContent = latest;
    }

    function renderTable() {
        const wrap = document.getElementById('tableWrap');

        if (allReceipts.length === 0) {
            wrap.innerHTML = `
                <div class="empty-state">
                    <div class="emoji">🧾</div>
                    No receipts yet. Upload one or add manually!
                </div>`;
            return;
        }

        const rows = allReceipts.map((r, index) => {
            const sourceClass = r.source === 'manual' ? 'manual' : '';
            const sourceLabel = r.source === 'manual' ? '✏️ Manual' : '📷 OCR';
            const date = r.date || r.created_at?.split('T')[0] || '—';
            const detailId = `receipt-detail-${index}`;
            const category = r.category || 'Other';
            const items = Array.isArray(r.items) ? r.items : [];
            const itemRows = items.length > 0
                ? items.map(item => {
                    const quantity = parseFloat(item.quantity || 1);
                    const unitPrice = parseFloat(item.unit_price ?? item.price ?? 0);
                    return `
                        <tr>
                            <td>${escapeHtml(item.name || 'Unknown item')}</td>
                            <td>${quantity}</td>
                            <td>${formatMoney(unitPrice)}</td>
                            <td>${formatMoney(itemLineTotal(item))}</td>
                        </tr>`;
                }).join('')
                : '<tr><td colspan="4" style="text-align:center; color:var(--ink-light); font-family:Space Grotesk, sans-serif;">No items recorded</td></tr>';

            return `
                <tr>
                    <td class="td-vendor">${escapeHtml(r.vendor || '—')}</td>
                    <td class="td-date">${escapeHtml(date)}</td>
                    <td class="td-total">${formatMoney(r.total)}</td>
                    <td><span class="source-badge ${sourceClass}">${sourceLabel}</span></td>
                    <td>
                        <div class="row-actions">
                            <button class="detail-btn" onclick="toggleDetails('${detailId}', this)">View Details</button>
                            <button class="delete-btn" onclick="deleteReceipt('${r._id}')">🗑</button>
                        </div>
                    </td>
                </tr>
                <tr class="detail-row" id="${detailId}" style="display:none;">
                    <td colspan="5">
                        <div class="receipt-detail">
                            <div class="receipt-paper">
                                <div class="receipt-head">
                                    <h3>${escapeHtml(r.vendor || 'Unknown Vendor')}</h3>
                                    <div class="receipt-meta">
                                        <span>${escapeHtml(date)}</span>
                                        <span>${escapeHtml(sourceLabel.replace('✏️ ', '').replace('📷 ', ''))}</span>
                                    </div>
                                    <span class="receipt-category">${escapeHtml(category)}</span>
                                </div>
                                <table class="digital-items">
                                    <thead>
                                        <tr>
                                            <th>Item</th>
                                            <th>Qty</th>
                                            <th>Price</th>
                                            <th>Total</th>
                                        </tr>
                                    </thead>
                                    <tbody>${itemRows}</tbody>
                                </table>
                                <div class="receipt-total">
                                    <span>Grand Total</span>
                                    <span>${formatMoney(r.total)}</span>
                                </div>
                                <div class="receipt-foot">Digital receipt generated from ${escapeHtml(sourceLabel.replace('✏️ ', '').replace('📷 ', ''))} entry</div>
                            </div>
                        </div>
                    </td>
                </tr>`;
        }).join('');

        wrap.innerHTML = `
            <table>
                <thead>
                    <tr>
                        <th>Vendor</th>
                        <th>Date</th>
                        <th>Total</th>
                        <th>Source</th>
                        <th style="text-align:right;">Actions</th>
                    </tr>
                </thead>
                <tbody>${rows}</tbody>
            </table>`;
    }

    function toggleDetails(id, button) {
        const row = document.getElementById(id);
        const isOpen = row.style.display === 'table-row';
        row.style.display = isOpen ? 'none' : 'table-row';
        button.textContent = isOpen ? 'View Details' : 'Hide Details';
    }

    // ── Delete ──
    async function deleteReceipt(id) {
        if (!confirm('Delete this receipt?')) return;
        try {
            const res = await fetch(`${API_BASE}/api/receipts/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (res.ok) {
                allReceipts = allReceipts.filter(r => r._id !== id);
                renderTable();
                renderStats();
            } else {
                alert('Failed to delete receipt.');
            }
        } catch (err) {
            alert('Error: ' + err.message);
        }
    }

    // ── Manual entry form ──
    document.getElementById('toggleForm').addEventListener('click', () => {
        const form = document.getElementById('manualForm');
        const isOpen = form.style.display !== 'none';
        form.style.display = isOpen ? 'none' : 'block';
        document.getElementById('toggleForm').textContent = isOpen ? '+ Add Manual Entry' : '✕ Close Form';
        if (!isOpen && document.querySelectorAll('.manual-item-row').length === 0) addManualItemRow();
    });

    document.getElementById('cancelManual').addEventListener('click', () => {
        document.getElementById('manualForm').style.display = 'none';
        document.getElementById('toggleForm').textContent = '+ Add Manual Entry';
        clearForm();
    });

    function clearForm() {
        ['f-vendor','f-date','f-total'].forEach(id => {
            document.getElementById(id).value = '';
        });
        document.getElementById('f-category').value = '';
        document.getElementById('manualItems').innerHTML = '';
        addManualItemRow();
        const s = document.getElementById('formStatus');
        s.style.display = 'none';
    }

    function addManualItemRow() {
        const container = document.getElementById('manualItems');
        const row = document.createElement('div');
        row.className = 'manual-item-row';
        row.innerHTML = `
            <div class="form-group">
                <label>Item</label>
                <input type="text" class="item-name" placeholder="e.g. Chain lube" />
            </div>
            <div class="form-group">
                <label>Quantity</label>
                <input type="number" class="item-quantity" min="0" step="1" value="1" />
            </div>
            <div class="form-group">
                <label>Unit Price</label>
                <input type="number" class="item-unit-price" min="0" step="0.01" placeholder="0.00" />
            </div>
            <button class="remove-item" type="button">×</button>
        `;
        row.querySelector('.remove-item').addEventListener('click', () => {
            row.remove();
            recalcManualTotal();
        });
        row.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', recalcManualTotal);
        });
        container.appendChild(row);
    }

    function getManualItems() {
        return Array.from(document.querySelectorAll('.manual-item-row')).map(row => {
            const name = row.querySelector('.item-name').value.trim();
            const quantity = parseFloat(row.querySelector('.item-quantity').value) || 0;
            const unitPrice = parseFloat(row.querySelector('.item-unit-price').value) || 0;
            return { name, quantity, unit_price: unitPrice };
        }).filter(item => item.name && item.quantity > 0);
    }

    function recalcManualTotal() {
        const total = getManualItems().reduce((sum, item) => sum + (item.quantity * item.unit_price), 0);
        document.getElementById('f-total').value = total ? total.toFixed(2) : '';
    }

    document.getElementById('addManualItem').addEventListener('click', addManualItemRow);

    document.getElementById('submitManual').addEventListener('click', async () => {
        const btn = document.getElementById('submitManual');
        const statusEl = document.getElementById('formStatus');

        const vendor     = document.getElementById('f-vendor').value.trim();
        const date       = document.getElementById('f-date').value;
        const total      = parseFloat(document.getElementById('f-total').value);
        const category   = document.getElementById('f-category').value;
        const items      = getManualItems();

        if (!vendor) {
            statusEl.textContent = 'Please enter the vendor name.';
            statusEl.className = 'form-status error';
            statusEl.style.display = 'block';
            return;
        }

        if (!date) {
            statusEl.textContent = 'Please choose the receipt date.';
            statusEl.className = 'form-status error';
            statusEl.style.display = 'block';
            return;
        }

        if (!category) {
            statusEl.textContent = 'Please select a category.';
            statusEl.className = 'form-status error';
            statusEl.style.display = 'block';
            document.getElementById('f-category').focus();
            return;
        }

        if (items.length === 0 || !total) {
            statusEl.textContent = 'Please add at least one item with quantity and unit price.';
            statusEl.className = 'form-status error';
            statusEl.style.display = 'block';
            return;
        }

        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span>Saving…';

        try {
            const res = await fetch(`${API_BASE}/api/receipts/manual`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ vendor, date, total: isNaN(total) ? null : total, category, items })
            });
            const data = await res.json();

            if (res.ok) {
                statusEl.textContent = '✓ Receipt saved!';
                statusEl.className = 'form-status success';
                statusEl.style.display = 'block';
                clearForm();
                await loadReceipts();
                setTimeout(() => { statusEl.style.display = 'none'; }, 2000);
            } else {
                throw new Error(data.detail || 'Failed to save');
            }
        } catch (err) {
            statusEl.textContent = err.message;
            statusEl.className = 'form-status error';
            statusEl.style.display = 'block';
        } finally {
            btn.disabled = false;
            btn.textContent = 'Save Receipt';
        }
    });

    // ── Init ──
    loadReceipts();
</script>
</body>
</html>
